name: prototype

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests unitaires
        working-directory: prototype
        run: python -m unittest -v test_commit_classifier.py
